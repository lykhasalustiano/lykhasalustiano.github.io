<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Portfolio</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#111111] text-white min-h-screen font-sans">

  <!-- NAVBAR -->
  <nav class="flex items-center justify-between px-16 py-6">
    <!-- Nav Links -->
    <div class="flex-1 flex items-center justify-center gap-12 mr-[100px]">
      <a href="#" class="text-white font-bold text-sm tracking-wide">Home</a>
      <a href="#" class="text-gray-400 text-sm tracking-wide hover:text-white transition-colors">Services</a>
      <a href="#" class="text-gray-400 text-sm tracking-wide hover:text-white transition-colors">About me</a>
      <a href="#" class="text-gray-400 text-sm tracking-wide hover:text-white transition-colors">Portfolio</a>
      <a href="#" class="text-gray-400 text-sm tracking-wide hover:text-white transition-colors">Contact me</a>
    </div>
    <!-- Hire Me Button -->
    <button class="bg-white text-black font-bold text-sm px-6 py-2.5 rounded hover:bg-gray-200 transition-colors">
      Hire Me
    </button>
  </nav>

  <!-- HERO SECTION -->
 <section class="flex items-center justify-between ml-[100px]">

    <!-- Left: Text Content -->
    <div class="flex flex-col max-w-lg mb-20">

      <!-- Greeting -->
      <p class="text-gray-500 text-base mb-2">Hi I am</p>

      <!-- Name -->
      <p class="text-gray-300 text-lg font-medium">Ma. Lykha Margarette L. Salustiano</p>

      <!-- Title -->
      <h1 class="text-5xl font-semibold text-white leading-tight mt-3">
        UI/UX designer
      </h1>

      <!-- Social Icons -->
      <div class="flex items-center gap-3 mt-2">

        <!-- Instagram -->
        <a href="#" class="w-10 h-10 rounded-full border border-gray-600 flex items-center justify-center text-gray-400 hover:border-white hover:text-white transition-all">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="17.5" cy="6.5" r="0.5" fill="currentColor"/>
          </svg>
        </a>

        <!-- LinkedIn -->
        <a href="#" class="w-10 h-10 rounded-full border border-gray-600 flex items-center justify-center text-gray-400 hover:border-white hover:text-white transition-all">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/>
            <rect x="2" y="9" width="4" height="12"/>
            <circle cx="4" cy="4" r="2"/>
          </svg>
        </a>

        <!-- GitHub -->
        <a href="#" class="w-10 h-10 rounded-full border border-gray-600 flex items-center justify-center text-gray-400 hover:border-white hover:text-white transition-all">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/>
          </svg>
        </a>

        <!-- Email -->
        <a href="#" class="w-10 h-10 rounded-full border border-gray-600 flex items-center justify-center text-gray-400 hover:border-white hover:text-white transition-all">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
        </a>

      </div>

      <!-- CTA Buttons -->
      <div class="flex items-center gap-4 mt-3">
        <button class="bg-white text-black font-bold text-sm px-8 py-3.5 rounded hover:bg-gray-100 transition-colors">
          Hire Me
        </button>
        <button class="bg-transparent text-white font-semibold text-sm px-8 py-3.5 rounded border border-white hover:bg-white hover:text-black transition-all">
          Download CV
        </button>
      </div>

    </div>

    <!-- Right: Profile Image -->
    <div class="w-[360px] h-[360px] mr-[110px]">
      <!-- Replace src with your actual photo path -->
      <img
        src="https://res.cloudinary.com/deogcjil5/image/upload/q_auto/f_auto/v1775560309/Screenshot_2026-04-07_191137_voeioo.png"
        class="w-full h-full object-cover"
      />
    </div>

  </section>

</body>
</html>
